name: FAIRassist
url: https://fairassist.org/
operator:
  name: FAIRsharing team and Data Readiness Group, University of Oxford
  url: https://fairsharing.org/
summary:
  en: >-
    A web application, part of the educational component of FAIRsharing, whose Tools page lists
    resources for assessing digital objects against the FAIR principles (33 entries on 2026-10-25).
    Its Registry page offers tabular and faceted views of principles, metrics and benchmarks.
  es: >-
    Una aplicación web, parte del componente educativo de FAIRsharing, cuya página Tools enumera
    recursos para evaluar objetos digitales según los principios FAIR (33 entradas el 2026-10-25).
    Su página Registry ofrece vistas en tabla y con facetas de principios, métricas y benchmarks.
status: available
status_note:
