# yaml-language-server: $schema=../tool.schema.json
id: fair-champion
kind: tool
section: datasets
name: FAIR Champion
url: https://tools.ostrails.eu/champion
operator:
  name: OSTrails project
  url: https://ostrails.eu/
summary:
  en: >-
    FAIR Champion runs FAIR Metric Tests registered in the OSTrails Test Registry, and Benchmark
    Quality Assessments built from them, against a digital object identified by its GUID (a URL,
    a DOI or another resolvable identifier). Its README describes it as an evolution of the FAIR
    Evaluator.
  es: >-
    FAIR Champion ejecuta FAIR Metric Tests registradas en el OSTrails Test Registry, y
    evaluaciones de calidad por benchmark construidas con ellas, sobre un objeto digital
    identificado por su GUID (una URL, un DOI u otro identificador resoluble). Su README la
    describe como una evolución de FAIR Evaluator.
best_for:
  en: Assessing a digital object that has a DOI or URL with a community-defined benchmark algorithm.
  es: Evaluar un objeto digital que tiene un DOI o una URL con un algoritmo de benchmark definido por una comunidad.
targets: [dataset, any_digital_object]
mode: automated
inputs: [doi, landing_page_url]
frameworks: [other]
output:
  en: >-
    A pass, fail or indeterminate result with a log for each test, and, for a benchmark algorithm,
    a score with narrative and guidance, as a web page or as JSON-LD.
  es: >-
    Un resultado de aprobado, fallido o indeterminado con un registro para cada prueba y, en el
    caso de un algoritmo de benchmark, una puntuación con narrativa y orientación, como página web
    o como JSON-LD.
api:
  available: true
  url: https://tools.ostrails.eu/champion/api
source_code: https://github.com/markwilkinson/FAIR-Champion
self_hostable: true
license: MIT
status: available
last_verified: 2026-10-25
references:
  - title: FAIR Champion README (GitHub)
    url: https://github.com/markwilkinson/FAIR-Champion
  - title: FAIR Champion API definition
    url: https://tools.ostrails.eu/champion/api
