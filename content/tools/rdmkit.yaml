summary:
  en: >-
    The Research Data Management toolkit for the life sciences. It offers guidelines that help
    make data FAIR, organized by data life cycle stage, role, domain and task, with catalogues of
    tools, resources and training resources.
  es: >-
    El kit de herramientas de gestión de datos de investigación para las ciencias de la vida.
    Ofrece pautas que ayudan a hacer los datos FAIR, organizadas por etapa del ciclo de vida de
    los datos, rol, ámbito y tarea, con catálogos de herramientas, recursos y recursos de
    formación.
