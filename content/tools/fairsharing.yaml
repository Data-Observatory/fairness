id: fairsharing
kind: directory
section: directories
name: FAIRsharing
url: https://fairsharing.org/
operator:
  name: FAIRsharing team, University of Oxford
  url: https://fairsharing.org/about
summary:
  en: >-
    A community-driven, manually curated registry of data and metadata standards, databases and
    data policies, for all subject areas. It also holds collections that group records, and
    searching or browsing needs no account.
  es: >-
    Un registro comunitario y curado manualmente de estándares de datos y metadatos, bases de datos
    y políticas de datos, para todas las áreas temáticas. También contiene colecciones que agrupan
    registros, y buscar o explorar no requiere una cuenta.
status: available
