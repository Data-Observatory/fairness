- date: 2026-11-02
  text:
    en: All entries that were listed before this date were checked again on 2026-11-02, and some status notes were updated.
    es: Todas las fichas listadas antes de esta fecha se revisaron de nuevo el 2026-11-02, y se actualizaron algunas notas de estado.
- date: 2026-11-02
  text:
    en: A Google Analytics tag was added to measure visits. It loads only after the visitor accepts it in a cookie notice, the choice is stored in the browser and it can be changed from the footer. The privacy statement was updated.
    es: Se agregó una etiqueta de Google Analytics para medir las visitas. Solo se carga cuando la persona visitante la acepta en un aviso de cookies, la elección se guarda en el navegador y puede cambiarse desde el pie de página. Se actualizó la declaración de privacidad.
- date: 2026-10-26
  text:
    en: The guided finder was added. It asks a few questions about what is being assessed and lists the entries that match, at a simple level and an advanced level.
    es: Se agregó el buscador guiado. Formula algunas preguntas sobre lo que se desea evaluar y lista las fichas que coinciden, en un nivel simple y un nivel avanzado.
- date: 2026-10-25
  text:
    en: First release, in English and Spanish. It lists FAIR assessment tools, frameworks and directories in sections, with filters by assessed object, mode, input, framework and status, and a table "Which tool fits?" by the input at hand.
    es: Primera publicación, en inglés y español. Lista herramientas, marcos de referencia y directorios de evaluación FAIR en secciones, con filtros por objeto evaluado, modo, entrada, marco y estado, y una tabla "¿Qué herramienta se ajusta a su caso?" según el dato de partida.
  tools:
