name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The scripts need Node 22.6 or later for --experimental-strip-types.
          node-version: 22.x
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run lint

      - run: npm run validate

      - run: npx vitest run

      - run: npm run build

      - run: npm run check:base-path

      - run: npx playwright install --with-deps

      - run: npx playwright test
