  - { id: manual, label: { en: Manual, es: Manual } }
  - id: hybrid
    label: { en: Hybrid, es: Híbrido }
    description:
      {
        en: Automated checks plus manual answers,
        es: Comprobaciones automáticas y respuestas manuales
      }
input:
  - { id: doi, label: { en: DOI, es: DOI } }
  - { id: landing_page_url, label: { en: Landing page URL, es: URL de la página de destino } }
  - { id: metadata_url, label: { en: Metadata URL, es: URL de metadatos } }
  - { id: metadata_file, label: { en: Metadata file, es: Archivo de metadatos } }
  - { id: ontology_uri, label: { en: Ontology URI, es: URI de la ontología } }
