filters: [target, mode, input, framework, status]
target:
  - { id: dataset, label: { en: Dataset, es: Conjunto de datos } }
  - { id: ontology, label: { en: Ontology, es: Ontología } }
  - { id: software, label: { en: Software, es: Software } }
  - { id: repository, label: { en: Repository, es: Repositorio } }
  - { id: any_digital_object, label: { en: Any digital object, es: Cualquier objeto digital } }
  - { id: person_knowledge, label: { en: Person knowledge, es: Conocimiento de la persona } }
mode:
